services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: madani
      POSTGRES_PASSWORD: madani
      POSTGRES_DB: madani_elearning
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U madani -d madani_elearning"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: madani
      MINIO_ROOT_PASSWORD: madani123
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: creates the app's bucket on MinIO so `docker compose up` alone
  # is enough — no manual console click-through needed.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 madani madani123 &&
      mc mb -p local/madani-elearning-content &&
      mc anonymous set download local/madani-elearning-content
      "

  # Local catch-all SMTP inbox — reminders sent in dev land here instead of
  # a real mailbox. Web UI at :8025 to inspect what was sent.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # WhatsApp HTTP API (WAHA). Port 3001 (not 3000) to avoid clashing with
  # `next dev`. The session needs a one-time QR-code link via the WAHA
  # dashboard at :3001 — see README "WhatsApp reminders" for that step.
  waha:
    image: devlikeapro/waha:latest
    platform: linux/amd64 # no arm64 image published — runs under emulation on Apple Silicon
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: NOWEB
    ports:
      - "3001:3000"
    volumes:
      - waha_data:/app/.sessions

  # Cache for expensive aggregate queries (see AnalyticsService) — the first
  # request per TTL window computes and stores the result, everything after
  # reads from here until it expires.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379" # not 6379 — avoids clashing with a locally-running Redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  minio_data:
  waha_data:
  redis_data:
